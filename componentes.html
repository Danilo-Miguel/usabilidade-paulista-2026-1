<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3  - Componentes em react</title>
</head>
<body>
    <div id="root"></div>

    <script src = "https://cdn.tailwindcss.com"></script> 
    <script src ="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src ="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>

    <script type="text/babel">

       function Botao(props){
        const handleClick = () => {
            alert('Botão clicado')

        }
        return(
            <button className={`bg-${props.cor}-500 hover:bg-${props.cor}-700 text-white font bold py-2 px-4 rounded`}
                onClick={props.aoClicar}

                >
            {props.texto}

            </button>
        )
       }


       function App(){

        const handleClick = () => alert('Botão clicado')
        return(
        <div className = "space-x-4"> 
         <Botao texto = "Enviar" cor="blue" aoClicar={handleClick}/>
        <Botao texto = "Cancelar" cor="red" aoClicar={handleClick}/>
           <Botao texto = "Cancelar" cor="green" aoClicar={() => console.log("Enviando...")}/>
        </div>
    )

       }


ReactDOM.createRoot(document.getElementById('root')).render
(

<App/>
);

    </script>
    
</body>
</html>
